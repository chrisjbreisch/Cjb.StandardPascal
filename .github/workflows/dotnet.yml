name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Cjb.StandardPascal.sln

      - name: Build
        run: dotnet build Cjb.StandardPascal.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Cjb.StandardPascal.sln --no-build --configuration Release